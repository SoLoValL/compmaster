{% extends "base.html" %}
{% load static %}

{% block title %}Вход — CompMaster{% endblock %}

{% block content %}
<section class="py-5 bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-box-arrow-in-right text-primary" style="font-size: 3rem;"></i>
                            <h3 class="mt-3">Вход в аккаунт</h3>
                            <p class="text-muted small">Введите свои данные для входа</p>
                        </div>

                        <form method="post">
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <label for="{{ form.username.id_for_label }}" class="form-label">Имя пользователя</label>
                                {{ form.username }}
                            </div>

                            <div class="mb-4">
                                <label for="{{ form.password.id_for_label }}" class="form-label">Пароль</label>
                                {{ form.password }}
                            </div>

                            <button type="submit" class="btn btn-primary w-100 btn-lg">
                                <i class="bi bi-box-arrow-in-right"></i> Войти
                            </button>
                        </form>

                        <hr class="my-4">

                        <div class="text-center">
                            <p class="mb-0">Нет аккаунта? <a href="{% url 'register' %}" class="text-decoration-none">Зарегистрироваться</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
