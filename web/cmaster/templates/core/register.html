{% extends "base.html" %}
{% load static %}

{% block title %}Регистрация — CompMaster{% endblock %}

{% block content %}
<section class="py-5 bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-person-plus text-primary" style="font-size: 3rem;"></i>
                            <h3 class="mt-3">Регистрация</h3>
                            <p class="text-muted small">Создайте аккаунт для заказа услуг</p>
                        </div>

                        <form method="post">
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <label for="id_username" class="form-label">Имя пользователя</label>
                                <input type="text" name="username" id="id_username" class="form-control" required 
                                       value="{{ form.username }}" placeholder="Ваш логин">
                            </div>

                            <div class="mb-3">
                                <label for="id_email" class="form-label">Email</label>
                                <input type="email" name="email" id="id_email" class="form-control" required 
                                       value="{{ form.email }}" placeholder="example@mail.ru">
                            </div>

                            <div class="mb-3">
                                <label for="id_password" class="form-label">Пароль</label>
                                <input type="password" name="password" id="id_password" class="form-control" required 
                                       placeholder="Минимум 8 символов">
                            </div>

                            <div class="mb-4">
                                <label for="id_password_confirm" class="form-label">Подтвердите пароль</label>
                                <input type="password" name="password_confirm" id="id_password_confirm" class="form-control" required 
                                       placeholder="Повторите пароль">
                            </div>

                            <button type="submit" class="btn btn-success w-100 btn-lg">
                                <i class="bi bi-person-plus"></i> Зарегистрироваться
                            </button>
                        </form>

                        <hr class="my-4">

                        <div class="text-center">
                            <p class="mb-0">Уже есть аккаунт? <a href="{% url 'login' %}" class="text-decoration-none">Войти</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
